<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор расписания стримов</title>
    <!-- Подключаем красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Кнопка скрытия панели */
        #toggle-panel-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 20px;
            background: #ff7b00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #toggle-panel-btn:hover {
            background: #e66a00;
        }

        /* Панель управления слева */
        .controls {
            width: 420px;
            background-color: #222;
            padding: 60px 20px 20px 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            flex-shrink: 0;
            transition: margin-left 0.3s ease;
        }

        .controls.hidden {
            margin-left: -420px;
        }

        .controls h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            font-family: inherit;
        }

        /* Стили для карточек настройки дней */
        .day-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .day-input-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff7b00;
        }

        .day-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .day-input-header h4 {
            font-size: 14px;
            color: #fff;
            margin: 0;
        }

        .date-time-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .date-time-row input {
            flex: 1;
        }

        .games-label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
            display: block;
        }

        .game-input-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .game-input-row input {
            flex: 1;
            padding: 6px 10px;
            font-size: 13px;
        }

        .delete-game-btn {
            background: #444;
            color: #ff4444;
            border: none;
            border-radius: 5px;
            width: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-game-btn:hover {
            background: #ff4444;
            color: #fff;
        }

        .add-game-btn {
            background: #333;
            color: #69C9D0;
            border: 1px dashed #555;
            border-radius: 5px;
            padding: 6px;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .add-game-btn:hover {
            background: #3a3a3a;
            border-color: #69C9D0;
        }

        /* Область предпросмотра справа */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #111;
            overflow: auto;
        }

        /* Сама карточка расписания */
        .schedule-card {
            width: 1080px;
            height: 1080px;
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=100'); 
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 20px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Затемнение фона */
        .schedule-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .card-header h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .socials {
            text-align: right;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .socials .twitch { color: #a970ff; }
        .socials .boosty { color: #ff7b00; }
        .socials .tiktok { color: #69C9D0; }

        /* Сетка */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto; /* Больше не растягивается */
            gap: 20px;
            align-content: start;
        }

        /* Карточка дня (Эффект стекла) */
        .day-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: fit-content;
            min-height: 180px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 16px;
            color: #ccc;
        }

        .day-header .day-name {
            font-weight: 800;
            color: #fff;
        }

        .day-header .day-time {
            font-weight: 600;
            font-size: 20px;
            color: #fff;
        }

        .day-games {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Карточка с аватаркой */
        .avatar-card {
            grid-column: span 2;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 180px;
        }

        .avatar-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Кнопка скрытия/показа панели -->
    <button id="toggle-panel-btn">Скрыть настройки</button>

    <!-- Панель управления -->
    <div class="controls" id="controls-panel">
        <h2>Общие настройки</h2>
        
        <div class="form-group">
            <label>Заголовок</label>
            <input type="text" id="input-title" value="Расписание стримов">
        </div>

        <div class="form-group">
            <label>Ссылка на фон (URL)</label>
            <input type="text" id="input-bg" value="https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=100">
        </div>

        <div class="form-group">
            <label>Ссылка на аватарку (URL)</label>
            <input type="text" id="input-avatar" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80">
        </div>

        <div class="form-group">
            <label>Twitch</label>
            <input type="text" id="input-twitch" value="twitch.tv/ellvi">
        </div>
        <div class="form-group">
            <label>Boosty</label>
            <input type="text" id="input-boosty" value="boosty.to/ellvi">
        </div>
        <div class="form-group">
            <label>TikTok</label>
            <input type="text" id="input-tiktok" value="tiktok.com/pchellvi">
        </div>

        <h2 style="margin-top: 30px;">Дни стримов</h2>
        <div class="day-inputs" id="day-inputs-container">
            <!-- Сюда JS сгенерирует поля для дней -->
        </div>
    </div>

    <!-- Область предпросмотра -->
    <div class="preview-area" id="preview-area">
        <div class="schedule-card" id="schedule-card">
            <div class="card-content">
                <div class="card-header">
                    <h1 id="display-title">Расписание<br>стримов</h1>
                    <div class="socials">
                        <span class="twitch" id="display-twitch">twitch.tv/ellvi</span>
                        <span class="boosty" id="display-boosty">boosty.to/ellvi</span>
                        <span class="tiktok" id="display-tiktok">tiktok.com/pchellvi</span>
                    </div>
                </div>
                <div class="grid" id="schedule-grid">
                    <!-- Карточка аватарки -->
                    <div class="avatar-card">
                        <img id="display-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Avatar">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Данные по умолчанию (7 дней, игры хранятся в массиве)
        let scheduleData = [
            { day: 'ПН', date: '22.12', time: '21:00', games: ['WoW', 'Aion 2'] },
            { day: 'ВТ', date: '23.12', time: '21:00', games: ['WoW'] },
            { day: 'СР', date: '24.12', time: '22:00', games: ['Aion 2', 'WoW'] },
            { day: 'ЧТ', date: '25.12', time: '19:00', games: ['Hogwarts Legacy', 'WoW'] },
            { day: 'ПТ', date: '26.12', time: '19:20', games: ['Hogwarts Legacy', 'WoW'] },
            { day: 'СБ', date: '27.12', time: '17:00', games: ['STALCRAFT X', 'WoW', 'Blue Lock'] },
            { day: 'ВС', date: '28.12', time: '19:00', games: ['AION 2 + Blue Lock', 'WoW'] }
        ];

        const daysContainer = document.getElementById('day-inputs-container');
        const gridContainer = document.getElementById('schedule-grid');
        const avatarCard = document.querySelector('.avatar-card');

        // Функция отрисовки панели настроек
        function renderInputs() {
            daysContainer.innerHTML = '';
            scheduleData.forEach((day, dIndex) => {
                const inputCard = document.createElement('div');
                inputCard.className = 'day-input-card';
                
                // Генерируем поля для игр
                let gamesHTML = '';
                day.games.forEach((game, gIndex) => {
                    gamesHTML += `
                        <div class="game-input-row">
                            <input type="text" value="${game}" oninput="updateGame(${dIndex}, ${gIndex}, this.value)" placeholder="Название игры">
                            <button class="delete-game-btn" onclick="removeGame(${dIndex}, ${gIndex})" title="Удалить игру">✕</button>
                        </div>
                    `;
                });

                inputCard.innerHTML = `
                    <div class="day-input-header">
                        <h4>${day.day}</h4>
                    </div>
                    <div class="date-time-row">
                        <input type="text" value="${day.date}" oninput="updateDayField(${dIndex}, 'date', this.value)" placeholder="Дата (дд.мм)">
                        <input type="text" value="${day.time}" oninput="updateDayField(${dIndex}, 'time', this.value)" placeholder="Время (чч:мм)">
                    </div>
                    <label class="games-label">Игры:</label>
                    <div id="games-container-${dIndex}">
                        ${gamesHTML}
                    </div>
                    <button class="add-game-btn" onclick="addGame(${dIndex})">+ Добавить игру</button>
                `;
                daysContainer.appendChild(inputCard);
            });
        }

        // Функция отрисовки предпросмотра
        function renderPreview() {
            // Удаляем старые карточки дней
            document.querySelectorAll('.day-card').forEach(el => el.remove());
            
            scheduleData.forEach((day) => {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                
                // Собираем игры в строки
                let gamesText = day.games.filter(g => g.trim() !== '').join('<br>');
                
                dayCard.innerHTML = `
                    <div class="day-header">
                        <span class="day-name">${day.day}:</span>
                        <span>Старт:</span>
                    </div>
                    <div class="day-header" style="margin-top: -15px;">
                        <span class="day-date">${day.date}</span>
                        <span class="day-time">${day.time}</span>
                    </div>
                    <div class="day-games">${gamesText || '&nbsp;'}</div>
                `;
                gridContainer.insertBefore(dayCard, avatarCard);
            });
        }

        // Обновление даты и времени
        window.updateDayField = function(dayIndex, field, value) {
            scheduleData[dayIndex][field] = value;
            const dayCards = document.querySelectorAll('.day-card');
            if (dayCards[dayIndex]) {
                if (field === 'date') dayCards[dayIndex].querySelector('.day-date').innerText = value;
                if (field === 'time') dayCards[dayIndex].querySelector('.day-time').innerText = value;
            }
        };

        // Обновление конкретной игры
        window.updateGame = function(dayIndex, gameIndex, value) {
            scheduleData[dayIndex].games[gameIndex] = value;
            renderPreview(); // Перерисовываем превью, чтобы обновить текст
        };

        // Добавление игры в день
        window.addGame = function(dayIndex) {
            scheduleData[dayIndex].games.push('');
            // Перерисовываем только инпуты этого дня и превью
            renderInputs(); 
            renderPreview();
            // Фокус на новое поле (опционально, но удобно)
            const container = document.getElementById(`games-container-${dayIndex}`);
            const inputs = container.querySelectorAll('input');
            if (inputs.length > 0) inputs[inputs.length - 1].focus();
        };

        // Удаление игры из дня
        window.removeGame = function(dayIndex, gameIndex) {
            scheduleData[dayIndex].games.splice(gameIndex, 1);
            renderInputs();
            renderPreview();
        };

        // Слушатели для шапки и соцсетей
        document.getElementById('input-title').addEventListener('input', (e) => {
            document.getElementById('display-title').innerHTML = e.target.value.replace(' ', '<br>');
        });
        document.getElementById('input-bg').addEventListener('input', (e) => {
            document.getElementById('schedule-card').style.backgroundImage = `url('${e.target.value}')`;
        });
        document.getElementById('input-avatar').addEventListener('input', (e) => {
            document.getElementById('display-avatar').src = e.target.value;
        });
        document.getElementById('input-twitch').addEventListener('input', (e) => {
            document.getElementById('display-twitch').innerText = e.target.value;
        });
        document.getElementById('input-boosty').addEventListener('input', (e) => {
            document.getElementById('display-boosty').innerText = e.target.value;
        });
        document.getElementById('input-tiktok').addEventListener('input', (e) => {
            document.getElementById('display-tiktok').innerText = e.target.value;
        });

        // Логика скрытия/показа панели
        const toggleBtn = document.getElementById('toggle-panel-btn');
        const controlsPanel = document.getElementById('controls-panel');

        toggleBtn.addEventListener('click', () => {
            controlsPanel.classList.toggle('hidden');
            if (controlsPanel.classList.contains('hidden')) {
                toggleBtn.innerText = 'Показать настройки';
            } else {
                toggleBtn.innerText = 'Скрыть настройки';
            }
        });

        // Первоначальная отрисовка
        renderInputs();
        renderPreview();
    </script>
</body>
</html>
