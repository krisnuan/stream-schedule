<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор расписания стримов</title>
    <!-- Подключаем красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Кнопка скрытия панели */
        #toggle-panel-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 20px;
            background: #ff7b00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #toggle-panel-btn:hover {
            background: #e66a00;
        }

        /* Панель управления слева */
        .controls {
            width: 400px;
            background-color: #222;
            padding: 60px 20px 20px 20px; /* Отступ сверху для кнопки */
            overflow-y: auto;
            border-right: 1px solid #333;
            flex-shrink: 0;
            transition: margin-left 0.3s ease;
        }

        .controls.hidden {
            margin-left: -400px; /* Сдвигаем панель за пределы экрана */
        }

        .controls h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            height: 60px;
        }

        .day-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-input-card {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }

        .day-input-card h4 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #ff7b00;
        }

        .day-input-card input {
            margin-bottom: 5px;
            font-size: 12px;
            padding: 6px;
        }

        /* Область предпросмотра справа */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #111;
            overflow: auto;
        }

        /* Сама карточка расписания */
        .schedule-card {
            width: 1080px; /* Увеличено для высокого разрешения */
            height: 1080px; /* Идеальный квадрат для соцсетей */
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=100'); 
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 20px;
            padding: 60px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Затемнение фона */
        .schedule-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .card-header h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .socials {
            text-align: right;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .socials .twitch { color: #a970ff; }
        .socials .boosty { color: #ff7b00; }
        .socials .tiktok { color: #69C9D0; }

        /* Сетка */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            flex: 1;
        }

        /* Карточка дня (Эффект стекла) */
        .day-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 16px;
            color: #ccc;
        }

        .day-header .day-name {
            font-weight: 800;
            color: #fff;
        }

        .day-header .day-time {
            font-weight: 600;
            font-size: 20px;
            color: #fff;
        }

        .day-games {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            white-space: pre-wrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* Карточка с аватаркой */
        .avatar-card {
            grid-column: span 2;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .avatar-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Кнопка скрытия/показа панели -->
    <button id="toggle-panel-btn">Скрыть настройки</button>

    <!-- Панель управления -->
    <div class="controls" id="controls-panel">
        <h2>Настройки</h2>
        
        <div class="form-group">
            <label>Заголовок</label>
            <input type="text" id="input-title" value="Расписание стримов">
        </div>

        <div class="form-group">
            <label>Ссылка на фон (URL)</label>
            <input type="text" id="input-bg" value="https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=100">
        </div>

        <div class="form-group">
            <label>Ссылка на аватарку (URL)</label>
            <input type="text" id="input-avatar" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80">
        </div>

        <div class="form-group">
            <label>Twitch</label>
            <input type="text" id="input-twitch" value="twitch.tv/ellvi">
        </div>
        <div class="form-group">
            <label>Boosty</label>
            <input type="text" id="input-boosty" value="boosty.to/ellvi">
        </div>
        <div class="form-group">
            <label>TikTok</label>
            <input type="text" id="input-tiktok" value="tiktok.com/pchellvi">
        </div>

        <h2>Дни стримов</h2>
        <div class="day-inputs" id="day-inputs-container">
            <!-- Сюда JS сгенерирует поля для дней -->
        </div>
    </div>

    <!-- Область предпросмотра -->
    <div class="preview-area" id="preview-area">
        <div class="schedule-card" id="schedule-card">
            <div class="card-content">
                <div class="card-header">
                    <h1 id="display-title">Расписание<br>стримов</h1>
                    <div class="socials">
                        <span class="twitch" id="display-twitch">twitch.tv/ellvi</span>
                        <span class="boosty" id="display-boosty">boosty.to/ellvi</span>
                        <span class="tiktok" id="display-tiktok">tiktok.com/pchellvi</span>
                    </div>
                </div>
                <div class="grid" id="schedule-grid">
                    <!-- Карточка аватарки -->
                    <div class="avatar-card">
                        <img id="display-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Avatar">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Данные по умолчанию
        const defaultSchedule = [
            { day: 'ПН', date: '22.12', time: '21:00', games: 'WoW\nAion 2' },
            { day: 'ВТ', date: '23.12', time: '21:00', games: 'WoW' },
            { day: 'СР', date: '24.12', time: '22:00', games: 'Aion 2\nWoW' },
            { day: 'ЧТ', date: '25.12', time: '19:00', games: 'Hogwarts Legacy\nWoW' },
            { day: 'ПТ', date: '26.12', time: '19:20', games: 'Hogwarts Legacy\nWoW' },
            { day: 'СБ', date: '27.12', time: '17:00', games: 'STALCRAFT X\nWoW\nBlue Lock' },
            { day: 'ВС', date: '28.12', time: '19:00', games: 'AION 2 + Blue Lock\nWoW' }
        ];

        const daysContainer = document.getElementById('day-inputs-container');
        const gridContainer = document.getElementById('schedule-grid');
        const avatarCard = document.querySelector('.avatar-card');

        // Функция генерации интерфейса
        function init() {
            defaultSchedule.forEach((item, index) => {
                // Поля ввода
                const inputCard = document.createElement('div');
                inputCard.className = 'day-input-card';
                inputCard.innerHTML = `
                    <h4>${item.day}</h4>
                    <input type="text" id="date-${index}" value="${item.date}" placeholder="Дата (дд.мм)">
                    <input type="text" id="time-${index}" value="${item.time}" placeholder="Время (чч:мм)">
                    <textarea id="games-${index}" placeholder="Игры (с новой строки)">${item.games}</textarea>
                `;
                daysContainer.appendChild(inputCard);

                // Карточки в предпросмотре
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                dayCard.innerHTML = `
                    <div class="day-header">
                        <span class="day-name">${item.day}:</span>
                        <span>Старт:</span>
                    </div>
                    <div class="day-header" style="margin-top: -15px;">
                        <span class="day-date" id="display-date-${index}">${item.date}</span>
                        <span class="day-time" id="display-time-${index}">${item.time}</span>
                    </div>
                    <div class="day-games" id="display-games-${index}">${item.games}</div>
                `;
                
                gridContainer.insertBefore(dayCard, avatarCard);
            });

            // Слушатели для обновления текста
            document.getElementById('input-title').addEventListener('input', (e) => {
                document.getElementById('display-title').innerHTML = e.target.value.replace(' ', '<br>');
            });
            document.getElementById('input-bg').addEventListener('input', (e) => {
                document.getElementById('schedule-card').style.backgroundImage = `url('${e.target.value}')`;
            });
            document.getElementById('input-avatar').addEventListener('input', (e) => {
                document.getElementById('display-avatar').src = e.target.value;
            });
            document.getElementById('input-twitch').addEventListener('input', (e) => {
                document.getElementById('display-twitch').innerText = e.target.value;
            });
            document.getElementById('input-boosty').addEventListener('input', (e) => {
                document.getElementById('display-boosty').innerText = e.target.value;
            });
            document.getElementById('input-tiktok').addEventListener('input', (e) => {
                document.getElementById('display-tiktok').innerText = e.target.value;
            });

            defaultSchedule.forEach((_, index) => {
                document.getElementById(`date-${index}`).addEventListener('input', (e) => {
                    document.getElementById(`display-date-${index}`).innerText = e.target.value;
                });
                document.getElementById(`time-${index}`).addEventListener('input', (e) => {
                    document.getElementById(`display-time-${index}`).innerText = e.target.value;
                });
                document.getElementById(`games-${index}`).addEventListener('input', (e) => {
                    document.getElementById(`display-games-${index}`).innerText = e.target.value;
                });
            });
        }

        // Инициализация
        init();

        // Логика скрытия/показа панели
        const toggleBtn = document.getElementById('toggle-panel-btn');
        const controlsPanel = document.getElementById('controls-panel');

        toggleBtn.addEventListener('click', () => {
            controlsPanel.classList.toggle('hidden');
            if (controlsPanel.classList.contains('hidden')) {
                toggleBtn.innerText = 'Показать настройки';
            } else {
                toggleBtn.innerText = 'Скрыть настройки';
            }
        });
    </script>
</body>
</html>
